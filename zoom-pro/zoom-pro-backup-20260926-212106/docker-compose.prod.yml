services:
  postgres:
    image: postgres:17
    container_name: zoom-pro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vzt_system
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_local_dev
    volumes:
      - zoom_pro_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d vzt_system']
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: zoom-pro-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "5000"
      DATABASE_URL: postgresql://postgres:postgres_local_dev@postgres:5432/vzt_system
      JWT_SECRET: change-me-in-production
      CORS_ORIGIN: http://localhost
      APP_NAME: zoom-pro
      TRUST_PROXY: "true"
      PG_POOL_MAX: "10"
      PG_IDLE_TIMEOUT_MS: "30000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:5000/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    container_name: zoom-pro-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  zoom_pro_pgdata:

