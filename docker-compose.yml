services:
  postgres:
    image: postgres:17
    container_name: pwa-vzt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vzt_system
      POSTGRES_USER: vzt_user
      POSTGRES_PASSWORD: vzt_pass
    ports:
      - '5432:5432'
    volumes:
      - pwa_vzt_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vzt_user -d vzt_system']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pwa_vzt_pgdata:
