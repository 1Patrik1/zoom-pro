name: Deploy frontend to Cloudflare Pages

# Automatické nasazení webové PWA na Cloudflare Pages při pushi do main.
# Předpoklady (GitHub Secrets):
#   CLOUDFLARE_API_TOKEN  — token s právem "Cloudflare Pages: Edit"
#   CLOUDFLARE_ACCOUNT_ID — ID účtu Cloudflare
# Backend + PostgreSQL se nasazují samostatně (viz .github/workflows/deploy.yml → VPS),
# protože Cloudflare Pages hostuje pouze statický frontend.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/frontend/**'
      - 'package.json'
      - 'package-lock.json'

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for successful CI and dependency audit for this commit
        uses: actions/github-script@v7
        with:
          script: |
            const required = ['build', 'Audit mobile npm dependencies', 'Audit root npm workspace'];
            const deadline = Date.now() + 15 * 60 * 1000;
            while (Date.now() < deadline) {
              const { data } = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: context.sha,
                per_page: 100
              });
              const latest = required.map((name) => data.check_runs
                .filter((check) => check.name === name)
                .sort((a, b) => String(b.started_at || '').localeCompare(String(a.started_at || '')))[0]);
              const failed = latest.find((check) =>
                check && check.status === 'completed' && check.conclusion !== 'success'
              );
              if (failed) {
                core.setFailed(`Required check failed for ${context.sha}: ${failed.name} (${failed.conclusion})`);
                return;
              }
              if (latest.every((check) =>
                check && check.status === 'completed' && check.conclusion === 'success'
              )) return;
              await new Promise((resolve) => setTimeout(resolve, 15000));
            }
            core.setFailed('CI and dependency audit did not complete successfully within 15 minutes.');

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate Cloudflare deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing GitHub Actions secret CLOUDFLARE_API_TOKEN. Add a scoped Cloudflare API token with Pages deployment permissions in Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing GitHub Actions secret CLOUDFLARE_ACCOUNT_ID. Add the Cloudflare account ID in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        run: npm run build -w apps/frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://api.zoom-pro.app' }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/frontend/dist --project-name=zoom-pro
