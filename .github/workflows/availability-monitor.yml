name: Zoom-pro availability monitor

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions may start scheduled jobs with some delay.
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: zoom-pro-availability-monitor
  cancel-in-progress: true

jobs:
  health-check:
    name: Check deployed backend health
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Require monitor URL configuration
        env:
          HEALTH_URL: ${{ vars.ZOOM_PRO_HEALTH_URL }}
        run: |
          if [ -z "$HEALTH_URL" ]; then
            echo "::error::Set repository variable ZOOM_PRO_HEALTH_URL to the public HTTPS health endpoint (for example https://your-domain.example/health). Do not use localhost."
            exit 1
          fi
          case "$HEALTH_URL" in
            https://*) ;;
            *) echo "::error::ZOOM_PRO_HEALTH_URL must use HTTPS."; exit 1 ;;
          esac

      - name: Check endpoint
        env:
          HEALTH_URL: ${{ vars.ZOOM_PRO_HEALTH_URL }}
        run: |
          set -eu
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --location             --connect-timeout 10 --max-time 25             --output "$response_file" --write-out '%{http_code}'             "$HEALTH_URL")" || {
              echo "::error::Health endpoint request failed."
              exit 1
            }
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Health endpoint returned HTTP $status."
            head -c 1000 "$response_file"
            exit 1
          fi
          if ! grep -Eiq '"(status|ok)"[[:space:]]*:[[:space:]]*("ok"|true)' "$response_file"; then
            echo "::error::HTTP succeeded, but response did not contain a recognized healthy JSON status."
            head -c 1000 "$response_file"
            exit 1
          fi
          echo "Health endpoint is responding with a recognized healthy status."
