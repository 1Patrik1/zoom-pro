name: Zoom Pro Deploy

on:
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: zoom-pro-production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  checks: read

jobs:
  deploy:
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require successful CI and dependency audit for this exact commit
        uses: actions/github-script@v7
        with:
          script: |
            const required = ['build', 'Audit mobile npm dependencies', 'Audit root npm workspace'];
            const { data } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              per_page: 100
            });
            for (const name of required) {
              const matches = data.check_runs
                .filter((check) => check.name === name)
                .sort((a, b) => String(b.started_at || '').localeCompare(String(a.started_at || '')));
              const latest = matches[0];
              if (!latest || latest.status !== 'completed' || latest.conclusion !== 'success') {
                core.setFailed(`Required check is missing or not successful for ${context.sha}: ${name}`);
              }
            }

      - name: Deploy exact tested commit to VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_SHA: ${{ github.sha }}
          INITIAL_ADMIN_PASSWORD: ${{ secrets.INITIAL_ADMIN_PASSWORD }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: DEPLOY_SHA,INITIAL_ADMIN_PASSWORD
          script: |
            set -Eeuo pipefail
            cd /opt/zoom-pro
            git fetch origin --tags --prune
            git checkout --detach "$DEPLOY_SHA"

            if ! docker compose -f docker-compose.prod.yml up -d --build --remove-orphans; then
              docker compose -f docker-compose.prod.yml logs --tail=120 migrate backend || true
              docker compose -f docker-compose.prod.yml rm -f migrate || true
              exit 1
            fi

            for attempt in $(seq 1 30); do
              health="$(docker inspect --format='{{.State.Health.Status}}' zoom-pro-backend 2>/dev/null || true)"
              if [ "$health" = "healthy" ]; then
                docker compose -f docker-compose.prod.yml ps
                docker compose -f docker-compose.prod.yml rm -f migrate
                exit 0
              fi
              if [ "$health" = "unhealthy" ]; then
                docker compose -f docker-compose.prod.yml logs --tail=120 backend migrate || true
                docker compose -f docker-compose.prod.yml rm -f migrate || true
                exit 1
              fi
              sleep 5
            done

            docker compose -f docker-compose.prod.yml logs --tail=120 backend migrate || true
            docker compose -f docker-compose.prod.yml rm -f migrate || true
            echo "Backend did not become healthy within 150 seconds." >&2
            exit 1
