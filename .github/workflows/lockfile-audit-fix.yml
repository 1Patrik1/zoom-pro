name: Generate safe npm audit fix PR

on:
  workflow_dispatch:
  push:
    branches:
      - audit/trigger-lockfile-fix
    paths:
      - "docs/LOCKFILE-AUDIT-FIX-TRIGGER.md"

permissions:
  contents: write
  pull-requests: write

jobs:
  fix-lockfiles:
    name: Apply non-major audit fixes and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: zoom_user
          POSTGRES_PASSWORD: zoom_pass
          POSTGRES_DB: zoom_pro
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json

      - name: Install root workspace
        run: npm ci --no-audit --no-fund

      - name: Apply only non-major root lockfile fixes
        run: npm audit fix --package-lock-only --ignore-scripts || true

      - name: Apply only non-major mobile lockfile fixes
        working-directory: apps/mobile
        run: npm audit fix --package-lock-only --ignore-scripts || true

      - name: Reinstall from updated lockfiles
        run: npm ci --no-audit --no-fund

      - name: Install mobile from updated lockfile
        working-directory: apps/mobile
        run: npm ci --no-audit --no-fund

      - name: Run SQL migrations against isolated CI database
        env:
          PGPASSWORD: zoom_pass
        run: |
          shopt -s nullglob
          migrations=(./[0-9][0-9][0-9]_*.sql)
          if [ ${#migrations[@]} -eq 0 ]; then
            echo "No numbered SQL migrations found" >&2
            exit 1
          fi
          for f in "${migrations[@]}"; do
            psql -v ON_ERROR_STOP=1 -h localhost -U zoom_user -d zoom_pro -f "$f"
          done

      - name: Test frontend
        run: npm run test -w apps/frontend

      - name: Build frontend
        run: npm run build -w apps/frontend

      - name: Build mobile
        run: npm run build --prefix apps/mobile

      - name: Test backend
        run: npm run test -w apps/backend

      - name: Check backend syntax
        working-directory: apps/backend
        run: node --check src/server.js && node --check src/app.js

      - name: Open PR with tested lockfile changes
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/npm-audit-fix-2026-10-18
          delete-branch: false
          add-paths: |
            package-lock.json
            apps/mobile/package-lock.json
          commit-message: "fix(deps): apply non-major npm audit fixes"
          title: "fix(deps): apply non-major npm audit fixes"
          body: |
            This PR contains lockfile-only changes generated by `npm audit fix --package-lock-only` without `--force`.
            The workflow ran frontend tests/build, mobile build, backend tests, syntax checks, and SQL migrations against an isolated CI PostgreSQL service before opening this PR.
            Major-version upgrades and package.json range changes are intentionally excluded.
          labels: |
            dependencies
            security
