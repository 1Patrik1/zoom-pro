version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Prague
    open-pull-requests-limit: 10
    versioning-strategy: increase
    groups:
      npm-patch-minor:
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - security

  - package-ecosystem: npm
    directory: /apps/mobile
    schedule:
      interval: weekly
      day: monday
      time: "08:30"
      timezone: Europe/Prague
    open-pull-requests-limit: 5
    versioning-strategy: increase
    groups:
      mobile-patch-minor:
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - security
