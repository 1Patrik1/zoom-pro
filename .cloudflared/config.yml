tunnel: zoom-pro
credentials-file: C:\Users\SF\.cloudflared\815a6ad7-9eb0-45e7-b491-6fd0d5325643.json

logfile: C:\Users\SF\.cloudflared\tunnel.log
loglevel: info

# Ingress rules - mapování externích domén na lokální služby
ingress:
  # Frontend (React app na localhost:80 Docker)
  - hostname: app.zoom-pro.app
    service: http://host.docker.internal:80
    originRequest:
      noTLSVerify: false
      connectTimeout: 30s

  # Backend API (Node.js na localhost:5000)
  - hostname: api.zoom-pro.app
    service: http://host.docker.internal:5000
    originRequest:
      noTLSVerify: false
      connectTimeout: 30s
      headers:
        X-Forwarded-Proto: https

  # Fallback
  - service: http_status:404
