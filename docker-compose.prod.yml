services:
  postgres:
    image: postgres:17
    container_name: pwa-vzt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vzt_system}
      POSTGRES_USER: ${POSTGRES_USER:-vzt_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vzt_pass}
    volumes:
      - pwa_vzt_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-vzt_user} -d ${POSTGRES_DB:-vzt_system}']
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-vzt_user}:${POSTGRES_PASSWORD:-vzt_pass}@postgres:5432/${POSTGRES_DB:-vzt_system}
    command: sh -c "npm ci && node scripts/db-run-sql.mjs 001_initial_schema.sql 002_seed_permissions.sql 003_seed_default_module_settings.sql 007_project_geo_and_gallery.sql 008_invoice_automation_and_permissions.sql 009_attendance_geo_guard_and_log_media.sql 005_seed_platform_superadmin.sql 006_seed_demo_profiles_and_records.sql"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: pwa-vzt-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "5000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-vzt_user}:${POSTGRES_PASSWORD:-vzt_pass}@postgres:5432/${POSTGRES_DB:-vzt_system}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      APP_NAME: pwa-vzt-system
      TRUST_PROXY: "true"
      PG_POOL_MAX: "10"
      PG_IDLE_TIMEOUT_MS: "30000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:5000/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    container_name: pwa-vzt-frontend
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pwa_vzt_pgdata:
